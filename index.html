<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Roca Vecchia AR</title>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100dvh;
        background-color: #ffffff;
        color: #1a1a1a;
        font-family: Arial, Helvetica, sans-serif;
      }

      .site-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        padding-top: max(16px, env(safe-area-inset-top));
        padding-right: max(16px, env(safe-area-inset-right));
        padding-left: max(16px, env(safe-area-inset-left));
      }

      .site-logo {
        display: block;
        width: clamp(80px, 22vw, 120px);
        height: auto;
      }

      .language-selector {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .language-button {
        display: grid;
        width: 44px;
        height: 44px;
        padding: 5px;
        border: 2px solid transparent;
        border-radius: 50%;
        background: transparent;
        cursor: pointer;
        place-items: center;
        -webkit-tap-highlight-color: transparent;
      }

      .language-button img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .language-button[aria-pressed="true"] {
        border-color: #1a1a1a;
      }

      .language-button:focus-visible {
        outline: 3px solid #3978c5;
        outline-offset: 2px;
      }

      .language-separator {
        width: 1px;
        height: 30px;
        background-color: #1a1a1a;
      }

      .intro {
        display: flex;
        flex: 1;
        flex-direction: column;
        align-items: center;
        margin-top: clamp(24px, 6vh, 64px);
        padding-right: max(24px, env(safe-area-inset-right));
        padding-bottom: max(32px, env(safe-area-inset-bottom));
        padding-left: max(24px, env(safe-area-inset-left));
        text-align: center;
      }

      .intro-logo {
        display: block;
        width: min(70vw, 420px);
        height: auto;
      }

      .intro-text {
        width: min(66vw, 390px);
        margin: clamp(14px, 2.5vh, 24px) 0 0;
        color: #836544;
        font-size: clamp(1rem, 3.8vw, 1.25rem);
        line-height: 1.5;
      }

      .read-more {
        display: inline-block;
        margin-top: clamp(6px, 1.5vh, 12px);
        padding: 6px 4px;
        color: #836544;
        font-size: clamp(1rem, 3.8vw, 1.2rem);
        font-weight: 700;
        text-underline-offset: 4px;
      }

      .read-more:focus-visible {
        outline: 3px solid #3978c5;
        outline-offset: 3px;
      }

      .ar-actions {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(18px, 4vh, 32px);
        width: 100%;
        margin-top: clamp(28px, 6vh, 56px);
      }

      .ar-button {
        display: block;
        width: min(62vw, 230px);
        border-radius: 12px;
        -webkit-tap-highlight-color: transparent;
      }

      .ar-button img {
        display: block;
        width: 100%;
        height: auto;
      }

      .ar-button:focus-visible {
        outline: 3px solid #3978c5;
        outline-offset: 5px;
      }

      .site-footer {
        display: flex;
        justify-content: center;
        padding-right: max(24px, env(safe-area-inset-right));
        padding-bottom: max(24px, env(safe-area-inset-bottom));
        padding-left: max(24px, env(safe-area-inset-left));
      }

      .footer-logo {
        display: block;
        width: clamp(140px, 42vw, 220px);
        height: auto;
      }

      @media (max-width: 900px) {
        html,
        body {
          height: 100%;
          overflow: hidden;
        }

        body {
          height: 100vh;
          height: 100dvh;
          min-height: 0;
        }

        .site-header {
          flex: 0 0 auto;
          padding-top: max(8px, env(safe-area-inset-top));
          padding-right: max(12px, env(safe-area-inset-right));
          padding-left: max(12px, env(safe-area-inset-left));
        }

        .site-logo {
          width: clamp(72px, 22vw, 100px);
        }

        .language-button {
          width: 40px;
          height: 40px;
          padding: 4px;
        }

        .language-separator {
          height: 26px;
        }

        .intro {
          min-height: 0;
          margin-top: clamp(4px, 1vh, 10px);
          padding-right: max(16px, env(safe-area-inset-right));
          padding-bottom: 4px;
          padding-left: max(16px, env(safe-area-inset-left));
        }

        .intro-logo {
          width: min(58vw, 300px);
        }

        .intro-text {
          width: min(54vw, 280px);
          margin-top: clamp(5px, 1vh, 8px);
          font-size: clamp(0.8rem, 3.5vw, 1rem);
          line-height: 1.3;
        }

        .read-more {
          margin-top: 0;
          padding: 3px 4px;
          font-size: clamp(0.8rem, 3.5vw, 1rem);
        }

        .ar-actions {
          gap: clamp(4px, 1vh, 8px);
          margin-top: clamp(4px, 1vh, 8px);
        }

        .ar-button {
          width: min(30vw, 17vh, 120px);
          width: min(30vw, 17dvh, 120px);
        }

        .site-footer {
          flex: 0 0 auto;
          padding-right: max(12px, env(safe-area-inset-right));
          padding-bottom: max(6px, env(safe-area-inset-bottom));
          padding-left: max(12px, env(safe-area-inset-left));
        }

        .footer-logo {
          width: clamp(100px, 28vw, 135px);
        }
      }

      @media (max-width: 900px) and (max-height: 500px) {
        .site-header {
          padding-top: max(4px, env(safe-area-inset-top));
        }

        .site-logo {
          width: 64px;
        }

        .language-button {
          width: 34px;
          height: 34px;
          padding: 3px;
        }

        .intro {
          margin-top: 2px;
          padding-bottom: 2px;
        }

        .intro-logo {
          width: min(42vw, 32vh, 260px);
          width: min(42vw, 32dvh, 260px);
        }

        .intro-text {
          width: min(50vw, 300px);
          margin-top: 2px;
          font-size: 0.72rem;
          line-height: 1.2;
        }

        .read-more {
          padding: 1px 3px;
          font-size: 0.72rem;
        }

        .ar-actions {
          gap: 2px;
          margin-top: 2px;
        }

        .ar-button {
          width: min(18vw, 12vh, 90px);
          width: min(18vw, 12dvh, 90px);
        }

        .site-footer {
          padding-bottom: max(3px, env(safe-area-inset-bottom));
        }

        .footer-logo {
          width: 80px;
        }
      }
    </style>
  </head>

  <body>
    <header class="site-header">
      <img
        class="site-logo"
        src="assets/ui/LogoART.png"
        alt="Logo ART"
        width="203"
        height="125"
      >

      <nav class="language-selector" aria-label="Selezione lingua">
        <button
          class="language-button"
          type="button"
          data-language="it"
          aria-label="Italiano"
          aria-pressed="true"
        >
          <img src="assets/ui/Ita.png" alt="" width="62" height="62">
        </button>

        <span class="language-separator" aria-hidden="true"></span>

        <button
          class="language-button"
          type="button"
          data-language="en"
          aria-label="English"
          aria-pressed="false"
        >
          <img src="assets/ui/En.png" alt="" width="62" height="62">
        </button>
      </nav>
    </header>

    <main class="intro">
      <img
        class="intro-logo"
        src="assets/ui/Logolarge.png"
        alt="Roca Vecchia AR"
        width="731"
        height="206"
      >

      <p class="intro-text" data-i18n="introText">
        Scegli il punto di interesse e scopri le ricostruzioni multimediali ...
      </p>

      <a class="read-more" href="istruzioni.html" data-i18n="readMore">
        leggi di più -&gt;
      </a>

      <div class="ar-actions" aria-label="Esperienze AR">
        <a
          class="ar-button"
          href="ar.html?target=mura"
          aria-label="Avvia l'esperienza AR delle mura"
        >
          <img
            src="assets/ui/Mura_it.png"
            alt="Mura"
            width="341"
            height="425"
            data-ar-image="walls"
          >
        </a>

        <a
          class="ar-button"
          href="ar.html?target=capanna"
          aria-label="Avvia l'esperienza AR della capanna"
        >
          <img
            src="assets/ui/Capanna_it.png"
            alt="Capanna"
            width="342"
            height="414"
            data-ar-image="hut"
          >
        </a>
      </div>
    </main>

    <footer class="site-footer">
      <img
        class="footer-logo"
        src="assets/ui/LogoCETMA.png"
        alt="CETMA"
        width="250"
        height="57"
      >
    </footer>

    <script>
      const languageButtons = document.querySelectorAll("[data-language]");
      const translations = {
        it: {
          introText:
            "Scegli il punto di interesse e scopri le ricostruzioni multimediali ...",
          readMore: "leggi di più ->",
          arButtons: {
            walls: {
              src: "assets/ui/Mura_it.png",
              alt: "Mura",
              label: "Avvia l'esperienza AR delle mura"
            },
            hut: {
              src: "assets/ui/Capanna_it.png",
              alt: "Capanna",
              label: "Avvia l'esperienza AR della capanna"
            }
          }
        },
        en: {
          introText:
            "Choose a point of interest and discover the multimedia reconstructions ...",
          readMore: "read more ->",
          arButtons: {
            walls: {
              src: "assets/ui/Wall_en.png",
              alt: "Walls",
              label: "Start the walls AR experience"
            },
            hut: {
              src: "assets/ui/Hut_en.png",
              alt: "Hut",
              label: "Start the hut AR experience"
            }
          }
        }
      };

      function selectLanguage(language) {
        document.documentElement.lang = language;

        languageButtons.forEach((button) => {
          button.setAttribute(
            "aria-pressed",
            String(button.dataset.language === language)
          );
        });

        document.querySelectorAll("[data-i18n]").forEach((element) => {
          element.textContent = translations[language][element.dataset.i18n];
        });

        document.querySelectorAll("[data-ar-image]").forEach((image) => {
          const content =
            translations[language].arButtons[image.dataset.arImage];

          image.src = content.src;
          image.alt = content.alt;
          image.closest(".ar-button").setAttribute("aria-label", content.label);
        });

        try {
          localStorage.setItem("preferredLanguage", language);
        } catch (error) {
          console.warn("Impossibile salvare la lingua selezionata.", error);
        }

        document.dispatchEvent(
          new CustomEvent("languagechange", { detail: { language } })
        );
      }

      languageButtons.forEach((button) => {
        button.addEventListener("click", () => {
          selectLanguage(button.dataset.language);
        });
      });

      try {
        const savedLanguage = localStorage.getItem("preferredLanguage");

        if (savedLanguage === "it" || savedLanguage === "en") {
          selectLanguage(savedLanguage);
        }
      } catch (error) {
        console.warn("Impossibile leggere la lingua salvata.", error);
      }
    </script>
  </body>
</html>
