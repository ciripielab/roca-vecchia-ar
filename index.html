<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Roca Vecchia AR</title>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100dvh;
        background-color: #ffffff;
        color: #1a1a1a;
        font-family: Arial, Helvetica, sans-serif;
      }

      .site-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        padding-top: max(16px, env(safe-area-inset-top));
        padding-right: max(16px, env(safe-area-inset-right));
        padding-left: max(16px, env(safe-area-inset-left));
      }

      .site-logo {
        display: block;
        width: clamp(80px, 22vw, 120px);
        height: auto;
      }

      .language-selector {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .language-button {
        display: grid;
        width: 44px;
        height: 44px;
        padding: 5px;
        border: 2px solid transparent;
        border-radius: 50%;
        background: transparent;
        cursor: pointer;
        place-items: center;
        -webkit-tap-highlight-color: transparent;
      }

      .language-button img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .language-button[aria-pressed="true"] {
        border-color: #1a1a1a;
      }

      .language-button:focus-visible {
        outline: 3px solid #3978c5;
        outline-offset: 2px;
      }

      .language-separator {
        width: 1px;
        height: 30px;
        background-color: #1a1a1a;
      }

      .intro {
        display: flex;
        flex: 1;
        flex-direction: column;
        align-items: center;
        margin-top: clamp(24px, 6vh, 64px);
        padding-right: max(24px, env(safe-area-inset-right));
        padding-bottom: max(32px, env(safe-area-inset-bottom));
        padding-left: max(24px, env(safe-area-inset-left));
        text-align: center;
      }

      .intro-logo {
        display: block;
        width: min(70vw, 420px);
        height: auto;
      }

      .intro-text {
        width: min(66vw, 390px);
        margin: clamp(14px, 2.5vh, 24px) 0 0;
        color: #836544;
        font-size: clamp(1rem, 3.8vw, 1.25rem);
        line-height: 1.5;
      }

      .read-more {
        display: inline-block;
        margin-top: clamp(6px, 1.5vh, 12px);
        padding: 6px 4px;
        color: #836544;
        font-size: clamp(1rem, 3.8vw, 1.2rem);
        font-weight: 700;
        text-underline-offset: 4px;
      }

      .read-more:focus-visible {
        outline: 3px solid #3978c5;
        outline-offset: 3px;
      }

      .ar-actions {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(18px, 4vh, 32px);
        width: 100%;
        margin-top: clamp(28px, 6vh, 56px);
      }

      .ar-button {
        display: block;
        width: min(68vw, 260px);
        border-radius: 12px;
        -webkit-tap-highlight-color: transparent;
      }

      .ar-button img {
        display: block;
        width: 100%;
        height: auto;
      }

      .ar-button:focus-visible {
        outline: 3px solid #3978c5;
        outline-offset: 5px;
      }

      .ar-actions--grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, auto));
        justify-content: center;
        max-width: min(86vw, 560px);
      }

      .ar-actions--grid .ar-button {
        width: min(38vw, 200px);
      }

      .site-footer {
        display: flex;
        justify-content: center;
        padding-right: max(24px, env(safe-area-inset-right));
        padding-bottom: max(24px, env(safe-area-inset-bottom));
        padding-left: max(24px, env(safe-area-inset-left));
      }

      .footer-logo {
        display: block;
        width: clamp(140px, 42vw, 220px);
        height: auto;
      }

      @media (max-width: 900px) {
        html,
        body {
          height: 100%;
          overflow: hidden;
        }

        body {
          height: 100vh;
          height: 100dvh;
          min-height: 0;
        }

        .site-header {
          flex: 0 0 auto;
          padding-top: max(8px, env(safe-area-inset-top));
          padding-right: max(12px, env(safe-area-inset-right));
          padding-left: max(12px, env(safe-area-inset-left));
        }

        .site-logo {
          width: clamp(72px, 22vw, 100px);
        }

        .language-button {
          width: 40px;
          height: 40px;
          padding: 4px;
        }

        .language-separator {
          height: 26px;
        }

        .intro {
          min-height: 0;
          margin-top: clamp(4px, 1vh, 10px);
          padding-right: max(16px, env(safe-area-inset-right));
          padding-bottom: 4px;
          padding-left: max(16px, env(safe-area-inset-left));
        }

        .intro-logo {
          width: min(58vw, 300px);
        }

        .intro-text {
          width: min(54vw, 280px);
          margin-top: clamp(5px, 1vh, 8px);
          font-size: clamp(0.8rem, 3.5vw, 1rem);
          line-height: 1.3;
        }

        .read-more {
          margin-top: 0;
          padding: 3px 4px;
          font-size: clamp(0.8rem, 3.5vw, 1rem);
        }

        .ar-actions {
          gap: clamp(4px, 1vh, 8px);
          margin-top: clamp(4px, 1vh, 8px);
        }

        .ar-button {
          width: min(34vw, 20vh, 145px);
          width: min(34vw, 20dvh, 145px);
        }

        .ar-actions--grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          width: min(74vw, 340px);
          gap: clamp(4px, 1vh, 8px) clamp(6px, 2vw, 12px);
        }

        .ar-actions--grid .ar-button {
          width: min(30vw, 16vh, 120px);
          width: min(30vw, 16dvh, 120px);
        }

        .site-footer {
          flex: 0 0 auto;
          padding-right: max(12px, env(safe-area-inset-right));
          padding-bottom: max(6px, env(safe-area-inset-bottom));
          padding-left: max(12px, env(safe-area-inset-left));
        }

        .footer-logo {
          width: clamp(100px, 28vw, 135px);
        }
      }

      @media (max-width: 900px) and (max-height: 500px) {
        .site-header {
          padding-top: max(4px, env(safe-area-inset-top));
        }

        .site-logo {
          width: 64px;
        }

        .language-button {
          width: 34px;
          height: 34px;
          padding: 3px;
        }

        .intro {
          margin-top: 2px;
          padding-bottom: 2px;
        }

        .intro-logo {
          width: min(42vw, 32vh, 260px);
          width: min(42vw, 32dvh, 260px);
        }

        .intro-text {
          width: min(50vw, 300px);
          margin-top: 2px;
          font-size: 0.72rem;
          line-height: 1.2;
        }

        .read-more {
          padding: 1px 3px;
          font-size: 0.72rem;
        }

        .ar-actions {
          gap: 2px;
          margin-top: 2px;
        }

        .ar-button {
          width: min(22vw, 15vh, 110px);
          width: min(22vw, 15dvh, 110px);
        }

        .ar-actions--grid {
          width: min(52vw, 330px);
          gap: 2px 6px;
        }

        .ar-actions--grid .ar-button {
          width: min(16vw, 14vh, 96px);
          width: min(16vw, 14dvh, 96px);
        }

        .site-footer {
          padding-bottom: max(3px, env(safe-area-inset-bottom));
        }

        .footer-logo {
          width: 80px;
        }
      }
    </style>
  </head>

  <body>
    <header class="site-header">
      <img
        class="site-logo"
        src="assets/ui/LogoART.png"
        alt="Logo ART"
        width="203"
        height="125"
      >

      <nav class="language-selector" aria-label="Selezione lingua">
        <button
          class="language-button"
          type="button"
          data-language="it"
          aria-label="Italiano"
          aria-pressed="true"
        >
          <img src="assets/ui/Ita.png" alt="" width="62" height="62">
        </button>

        <span class="language-separator" aria-hidden="true"></span>

        <button
          class="language-button"
          type="button"
          data-language="en"
          aria-label="English"
          aria-pressed="false"
        >
          <img src="assets/ui/En.png" alt="" width="62" height="62">
        </button>
      </nav>
    </header>

    <main class="intro">
      <img
        class="intro-logo"
        src="assets/ui/Logolarge.png"
        alt="Roca Vecchia AR"
        width="731"
        height="206"
      >

      <p class="intro-text" data-i18n="introText">
        Scegli il punto di interesse e scopri le ricostruzioni multimediali ...
      </p>

      <a class="read-more" href="istruzioni.html" data-i18n="readMore">
        leggi di più -&gt;
      </a>

      <div class="ar-actions" aria-label="Esperienze AR"></div>
    </main>

    <footer class="site-footer">
      <img
        class="footer-logo"
        src="assets/ui/LogoCETMA.png"
        alt="CETMA"
        width="250"
        height="57"
      >
    </footer>

    <script>
      const languageButtons = document.querySelectorAll("[data-language]");
      const arActions = document.querySelector(".ar-actions");
      const fallbackPois = [
        {
          id: "mura",
          enabled: true,
          targetIndex: 0,
          thumbnail: {
            it: "assets/ui/Mura_it.png",
            en: "assets/ui/Wall_en.png"
          },
          title: {
            it: "Le mura",
            en: "The Walls"
          },
          video: "assets/videos/Mura.mp4",
          audio: {
            it: "assets/audio/mura_it.mp3",
            en: "assets/audio/mura_en.mp3"
          }
        },
        {
          id: "capanna",
          enabled: true,
          targetIndex: 1,
          thumbnail: {
            it: "assets/ui/Capanna_it.png",
            en: "assets/ui/Hut_en.png"
          },
          title: {
            it: "La capanna",
            en: "The Hut"
          },
          video: "assets/videos/Capanna.mp4",
          audio: {
            it: "assets/audio/capanna_it.mp3",
            en: "assets/audio/capanna_en.mp3"
          }
        }
      ];
      let pois = [];
      let currentLanguage = "it";
      const translations = {
        it: {
          introText:
            "Scegli il punto di interesse e scopri le ricostruzioni multimediali ...",
          readMore: "leggi di più ->",
          arLabel: "Avvia l'esperienza AR"
        },
        en: {
          introText:
            "Choose a point of interest and discover the multimedia reconstructions ...",
          readMore: "read more ->",
          arLabel: "Start the AR experience"
        }
      };

      function getLocalizedValue(value, language) {
        if (!value) {
          return "";
        }

        if (typeof value === "string") {
          return value;
        }

        return value[language] || value.it || value.en || "";
      }

      function getEnabledPois(data) {
        const list = data && Array.isArray(data.pois) ? data.pois : [];

        return list.filter((poi) => poi && poi.id && poi.enabled !== false);
      }

      function createArButton(poi, language) {
        const title = getLocalizedValue(poi.title, language) || poi.id;
        const thumbnail = getLocalizedValue(poi.thumbnail, language);
        const audio = getLocalizedValue(poi.audio, language);
        const params = new URLSearchParams({ target: poi.id });
        const link = document.createElement("a");
        const image = document.createElement("img");

        link.className = "ar-button";
        link.href = `ar.html?${params.toString()}`;
        link.setAttribute(
          "aria-label",
          `${translations[language].arLabel}: ${title}`
        );
        link.dataset.poiId = poi.id;

        if (poi.targetIndex !== undefined && poi.targetIndex !== null) {
          link.dataset.targetIndex = poi.targetIndex;
        }

        if (poi.video) {
          link.dataset.video = poi.video;
        }

        if (audio) {
          link.dataset.audio = audio;
        }

        image.src = thumbnail;
        image.alt = title;
        image.decoding = "async";

        link.appendChild(image);

        return link;
      }

      function renderArButtons(language) {
        const visiblePois = pois.filter((poi) =>
          Boolean(getLocalizedValue(poi.thumbnail, language))
        );
        const fragment = document.createDocumentFragment();

        arActions.textContent = "";
        arActions.classList.toggle("ar-actions--grid", visiblePois.length > 2);

        visiblePois.forEach((poi) => {
          fragment.appendChild(createArButton(poi, language));
        });

        arActions.appendChild(fragment);
      }

      function selectLanguage(language) {
        currentLanguage = translations[language] ? language : "it";
        document.documentElement.lang = currentLanguage;

        languageButtons.forEach((button) => {
          button.setAttribute(
            "aria-pressed",
            String(button.dataset.language === currentLanguage)
          );
        });

        document.querySelectorAll("[data-i18n]").forEach((element) => {
          element.textContent =
            translations[currentLanguage][element.dataset.i18n];
        });

        renderArButtons(currentLanguage);

        try {
          localStorage.setItem("preferredLanguage", currentLanguage);
        } catch (error) {
          console.warn("Impossibile salvare la lingua selezionata.", error);
        }

        document.dispatchEvent(
          new CustomEvent("languagechange", {
            detail: { language: currentLanguage }
          })
        );
      }

      async function loadPois() {
        try {
          const response = await fetch("data/pois.json", { cache: "no-cache" });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          pois = getEnabledPois(await response.json());
        } catch (error) {
          console.warn(
            "Impossibile caricare data/pois.json. Uso i POI locali di fallback.",
            error
          );
          pois = fallbackPois;
        }

        renderArButtons(currentLanguage);
      }

      languageButtons.forEach((button) => {
        button.addEventListener("click", () => {
          selectLanguage(button.dataset.language);
        });
      });

      try {
        const savedLanguage = localStorage.getItem("preferredLanguage");

        if (savedLanguage === "it" || savedLanguage === "en") {
          currentLanguage = savedLanguage;
        }
      } catch (error) {
        console.warn("Impossibile leggere la lingua salvata.", error);
      }

      selectLanguage(currentLanguage);
      loadPois();
    </script>
  </body>
</html>
