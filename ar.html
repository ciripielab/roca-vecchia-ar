<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Roca Vecchia AR</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      :root {
        --ar-accent: #f2a100;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000000;
        color: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
      }

      .ar-ui {
        position: fixed;
        top: 0;
        right: 0;
        left: 0;
        z-index: 10;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        padding-top: max(12px, env(safe-area-inset-top));
        padding-right: max(12px, env(safe-area-inset-right));
        padding-left: max(12px, env(safe-area-inset-left));
        pointer-events: none;
      }

      .back-button,
      .start-button {
        pointer-events: auto;
        -webkit-tap-highlight-color: transparent;
      }

      .back-button {
        display: grid;
        flex: 0 0 auto;
        width: 48px;
        height: 48px;
        padding: 2px;
        border: 0;
        border-radius: 50%;
        background: transparent;
        place-items: center;
      }

      .back-button img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .page-logo {
        display: block;
        width: clamp(140px, 42vw, 220px);
        height: auto;
        pointer-events: none;
      }

      .status-panel {
        position: fixed;
        right: max(16px, env(safe-area-inset-right));
        bottom: max(24px, env(safe-area-inset-bottom));
        left: max(16px, env(safe-area-inset-left));
        z-index: 10;
        display: grid;
        gap: 12px;
        justify-items: center;
        pointer-events: none;
      }

      .status-message {
        max-width: min(92vw, 560px);
        margin: 0;
        padding: 12px 16px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.72);
        color: #ffffff;
        font-size: clamp(0.95rem, 3.8vw, 1.1rem);
        line-height: 1.35;
        text-align: center;
      }

      .start-button {
        min-width: 160px;
        padding: 12px 18px;
        border: 0;
        border-radius: 999px;
        background: var(--ar-accent);
        color: #ffffff;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 700;
      }

      .start-button[hidden] {
        display: none;
      }

      .start-button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      .back-button:focus-visible,
      .start-button:focus-visible {
        outline: 3px solid #ffffff;
        outline-offset: 3px;
      }

      a-scene {
        position: fixed;
        inset: 0;
        z-index: 1;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background: transparent !important;
      }

      canvas.a-canvas {
        z-index: 2 !important;
        background: transparent !important;
      }

      video {
        position: fixed !important;
        inset: 0 !important;
        z-index: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        height: 100dvh !important;
        object-fit: cover !important;
        background: transparent !important;
      }

      .mindar-ui-scanning .scanning .inner,
      .mindar-ui-scanning .scanning .inner::before,
      .mindar-ui-scanning .scanning .inner::after,
      .mindar-ui-scanning .scanning .inner * {
        border-color: var(--ar-accent) !important;
      }

      .mindar-ui-scanning .scanning .inner > div,
      .mindar-ui-scanning .scanning .inner .scanline,
      .mindar-ui-scanning .scanning .inner .scanline::before,
      .mindar-ui-scanning .scanning .inner .scanline::after {
        background-color: var(--ar-accent) !important;
        box-shadow: 0 0 12px rgba(242, 161, 0, 0.65) !important;
      }

      .mindar-ui-scanning .scanning .inner {
        box-shadow: 0 0 0 1px rgba(242, 161, 0, 0.25) !important;
      }
    </style>
  </head>

  <body>
    <div class="ar-ui">
      <a class="back-button" href="index.html" aria-label="Torna alla pagina iniziale">
        <img src="assets/ui/back.png" alt="" width="94" height="94">
      </a>

      <img
        class="page-logo"
        src="assets/ui/Logosmall.png"
        alt="Roca Vecchia AR"
        width="359"
        height="103"
      >
    </div>

    <div class="status-panel" aria-live="polite">
      <p class="status-message" id="status-message">
        Preparazione esperienza AR...
      </p>
      <button class="start-button" id="start-button" type="button" disabled>
        Avvia camera
      </button>
    </div>

    <a-scene
      id="ar-scene"
      mindar-image="imageTargetSrc: assets/targets/targets.mind; autoStart: false;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights; alpha: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      loading-screen="enabled: false"
    >
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity id="selected-target"></a-entity>
    </a-scene>

    <script src="js/ar.js"></script>
  </body>
</html>
